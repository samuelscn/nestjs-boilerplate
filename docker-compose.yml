name: nestjs-boilerplate

services:
  api:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: 3000
      LOG_LEVEL: info
      LOG_RULES: context=*;level=info
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ginga_app
      DATABASE_PASSWORD: ginga_app_dev
      DATABASE_NAME: nestjs_boilerplate
      AUTHORIZATION_MODE: ${AUTHORIZATION_MODE:-single}
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-fake}
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs_boilerplate
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nestjs_boilerplate"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/001-development-roles.sql:/docker-entrypoint-initdb.d/001-development-roles.sql:ro

volumes:
  postgres-data:
